<!DOCTYPE html>
<html>
<head>
    <title>RaidBot Terminal</title>
    <style>
        body { background: #0a0a0a; color: #00ff00; font-family: 'Courier New', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { border: 1px solid #333; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 0 20px rgba(0, 255, 0, 0.1); }
        h1 { font-size: 2em; margin-bottom: 10px; }
        .status { color: #00ff00; font-weight: bold; }
        .mode { color: #888; font-size: 0.9em; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RAIDBOT TERMINAL</h1>
        <p>Status: <span class="status">ONLINE & ACTIVE</span></p>
        <p class="mode">Mode: PRIVATE ACCESS (OWNER ONLY)</p>
    </div>
</body>
</html>
